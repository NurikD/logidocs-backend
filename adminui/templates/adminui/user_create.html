{% extends "main/base.html" %}
{% block title %}Создать пользователя{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-10">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6 sm:mb-8">
    <div class="flex-1">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 flex items-center gap-2 sm:gap-3">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
        </div>
        <span>Новый пользователь</span>
      </h1>
      <p class="text-sm sm:text-base text-gray-600 mt-2">Заполните информацию о новом пользователе</p>
    </div>
    <a href="{% url 'adminui:users_list' %}"
       class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl text-gray-700 hover:bg-gray-100 transition-all font-medium border border-gray-200 shadow-sm hover:shadow whitespace-nowrap">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
      </svg>
      К списку
    </a>
  </div>

  <!-- Form Card -->
  <div class="bg-white rounded-2xl shadow-lg border border-gray-200 overflow-hidden">

    <!-- Form Body -->
    <form method="post" class="p-6 sm:p-8">
      {% csrf_token %}

      <div class="space-y-6">

        <!-- Username -->
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2 flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            Логин
            <span class="text-red-500">*</span>
          </label>
          <input type="text" name="username" required
                 class="block w-full px-4 py-3 bg-white border-2 border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all hover:border-gray-400"
                 placeholder="Введите логин" />
          <p class="text-xs text-gray-500 mt-2">Уникальное имя для входа в систему</p>
        </div>

        <!-- First and Last Name Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

          <!-- First Name -->
          <div>
            <label class="block text-sm font-semibold text-gray-900 mb-2 flex items-center gap-2">
              <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              Имя
            </label>
            <input type="text" name="first_name"
                   class="block w-full px-4 py-3 bg-white border-2 border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all hover:border-gray-400"
                   placeholder="Введите имя" />
          </div>

          <!-- Last Name -->
          <div>
            <label class="block text-sm font-semibold text-gray-900 mb-2 flex items-center gap-2">
              <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              Фамилия
            </label>
            <input type="text" name="last_name"
                   class="block w-full px-4 py-3 bg-white border-2 border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all hover:border-gray-400"
                   placeholder="Введите фамилию" />
          </div>

        </div>

        <!-- Телефон -->
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2 flex items-center gap-2">
            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
            Телефон
          </label>
          <input type="tel" name="phone"
                 class="block w-full px-4 py-3 bg-white border-2 border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all hover:border-gray-400"
                 placeholder="+996 XXX XXX XXX" />
          <p class="text-xs text-gray-500 mt-2">Номер для связи с клиентом</p>
        </div>

      </div>

      <!-- Hidden fields for is_staff and is_active with default values -->
      <input type="hidden" name="is_staff" value="on" />
      <input type="hidden" name="is_active" value="on" />

      <!-- Form Footer -->
      <div class="mt-8 pt-6 border-t border-gray-200 flex flex-col sm:flex-row gap-3">
        <button type="submit"
                class="flex-1 inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold hover:from-blue-700 hover:to-indigo-700 transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          Создать пользователя
        </button>
        <a href="{% url 'adminui:users_list' %}"
           class="w-full sm:w-auto text-center px-6 py-3 rounded-xl bg-gray-100 text-gray-700 font-medium hover:bg-gray-200 transition-all">
          Отмена
        </a>
      </div>

    </form>

  </div>
    </div>
  </div>

</div>

{% endblock %}
