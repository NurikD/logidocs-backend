{% extends "main/base.html" %}
{% block title %}Пользователи — AdminUI{% endblock %}
{% block content %}

<div class="max-w-7xl mx-auto px-4 py-8">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-10">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-4xl font-bold text-gray-900 flex items-center gap-3">
          Пользователи
          <span class="inline-flex items-center px-3 py-1 rounded-full text-lg font-semibold bg-blue-100 text-blue-800">
            {{ users|length }}
          </span>
        </h1>
        <p class="text-gray-500 mt-1 text-lg">Управление пользователями системы</p>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3">
      <!-- Search Input -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
        <input
          id="search-input"
          name="q"
          value="{{ q|default:'' }}"
          placeholder="Поиск пользователей..."
          class="pl-11 pr-4 py-3 rounded-xl border-2 border-gray-300 w-full sm:w-64 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all shadow-sm hover:border-gray-400"
          hx-get="{% url 'adminui:users_list' %}"
          hx-target="#users-grid"
          hx-trigger="keyup changed delay:250ms"
          hx-push-url="true"
          hx-preserve="true"
        />
      </div>

      <!-- Create User Button -->
      <a href="{% url 'adminui:user_create' %}"
         class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold hover:from-blue-700 hover:to-indigo-700 transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5 whitespace-nowrap">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Создать пользователя
      </a>
    </div>
  </div>

  <!-- Users Grid -->
  <div id="users-grid">
    {% include "adminui/_users_grid.html" %}
  </div>

</div>
{% endblock %}
